services:
  asterisk:
    image: andrius/asterisk:latest
    container_name: asterisk-server
    network_mode: host
    volumes:
      - ./config/pjsip.conf:/etc/asterisk/pjsip.conf
      - ./config/extensions.conf:/etc/asterisk/extensions.conf
      - ./config/http.conf:/etc/asterisk/http.conf
      - ./config/ari.conf:/etc/asterisk/ari.conf
    restart: unless-stopped

  intercom-sync-agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: intercom-sync-agent
    network_mode: host
    depends_on:
      - asterisk
    env_file:
      - .env
    environment:
      HEADEND_URL: ${HEADEND_URL}
      HEADEND_AMQP_EXCHANGE: ${HEADEND_AMQP_EXCHANGE}
      HEADEND_AMQP_EXCHANGE_TYPE: ${HEADEND_AMQP_EXCHANGE_TYPE}
      HEADEND_AMQP_QUEUE: ${HEADEND_AMQP_QUEUE}
      HEADEND_AMQP_ROUTING_KEY: ${HEADEND_AMQP_ROUTING_KEY}
      HEADEND_AMQP_USERNAME: ${HEADEND_AMQP_USERNAME}
      HEADEND_AMQP_PASSWORD: ${HEADEND_AMQP_PASSWORD}
      PJSIP_BASE_DIR: ${PJSIP_BASE_DIR}
    volumes:
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
