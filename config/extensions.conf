[general]
static=yes
writeprotect=no

[internal]
; Dial intercom endpoints using MAC address without colons (12 hex chars)
exten => _[0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f][0-9A-Fa-f],1,NoOp(Calling intercom ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

; Echo test
exten => 600,1,NoOp(Echo Test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Playback test
exten => 601,1,NoOp(Playback Test)
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
